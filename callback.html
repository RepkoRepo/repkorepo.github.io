<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla login done</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  textarea { width: 100%; height: 140px; font-family: monospace; }
  button { padding: 10px 18px; font-size: 16px; margin-top: 8px; }
</style>
</head>
<body>
<h1>Tesla login done</h1>
<p>Copy the text below and paste it into the PowerShell window.</p>
<textarea id="u" readonly></textarea>
<button id="b">Copy</button>
<script>
  var box = document.getElementById("u");
  box.value = location.href;
  document.getElementById("b").onclick = function () {
    box.select();
    navigator.clipboard.writeText(box.value);
    this.textContent = "Copied";
  };
</script>
</body>
</html>
